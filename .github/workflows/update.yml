name: Update Byte
on:
  schedule:
    - cron: '17 */3 * * *'   # every 3 hours, off the busy top of the hour
  push:
    branches: [main]
    paths-ignore: ['assets/**', 'state/**', 'README.md', 'site/**', 'previews/**']
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: byte-refresh
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Answer any Byte issues still waiting
        run: |
          git config user.name "byte-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npx tsx scripts/interact.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Decay, pick mood, redraw
        run: npx tsx scripts/update.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit only if something changed
        run: |
          git config user.name "byte-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md assets state
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Byte: scheduled update"
          git push || (git pull --rebase -X theirs && git push)
