<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 132" width="132" height="132" role="img" aria-label="Square 3: empty. Open an issue to play X here."><title>Square 3: empty. Open an issue to play X here.</title><style>
text{font-family:'Fredoka','Trebuchet MS',sans-serif;fill:#2B2017}.b{font-weight:600}.s{fill:#77675A}.m{font-family:'JBMono',ui-monospace,monospace;font-weight:500}.a{fill:#B83D0B}
.dr{animation:dr .5s cubic-bezier(.2,.8,.2,1) both}.d2{animation-delay:.22s}@keyframes dr{from{stroke-dashoffset:10}to{stroke-dashoffset:0}}
.hint{transform-box:fill-box;transform-origin:center;animation:hint 2.4s cubic-bezier(.65,0,.35,1) 0.42s infinite}@keyframes hint{0%,100%{transform:scale(.7);opacity:.6}50%{transform:scale(1.5);opacity:1}}
.hot{animation:hot 1s cubic-bezier(.65,0,.35,1) infinite alternate}@keyframes hot{from{opacity:.25}to{opacity:.9}}.cell{transform-box:fill-box;transform-origin:center;}@keyframes win{from{transform:scale(.94)}to{transform:scale(1)}}
